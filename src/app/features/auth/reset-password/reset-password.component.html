<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <div class="brand">
        <div class="brand-mark">AG<span>M</span></div>
        <div class="brand-sub">Nueva Contraseña</div>
      </div>
    </mat-card-header>

    <mat-card-content>
      <p class="helper-text">Ingresa tu nueva contraseña para el sistema.</p>
      
      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Nueva Contraseña</mat-label>
          <input matInput formControlName="newPassword"
                 [type]="hidePassword() ? 'password' : 'text'" />
          <button mat-icon-button matSuffix type="button"
                  (click)="hidePassword.set(!hidePassword())">
            <mat-icon>{{ hidePassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          @if (form.get('newPassword')?.touched && form.get('newPassword')?.invalid) {
            <mat-error>Mínimo 4 caracteres</mat-error>
          }
        </mat-form-field>

        <button mat-flat-button class="submit-btn" type="submit" [disabled]="loading()">
          @if (loading()) {
            <mat-spinner diameter="20" />
          } @else {
            Guardar Contraseña
          }
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
