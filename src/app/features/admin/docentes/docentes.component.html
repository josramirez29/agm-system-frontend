<div class="page">
  <div class="page-header">
    <h2 class="page-title">Docentes</h2>
    <div class="actions">
      <label class="import-btn" matTooltip="Importar desde PDF">
        @if (importing()) {
          <mat-spinner diameter="20" />
        } @else {
          <mat-icon>upload_file</mat-icon> Importar PDF
        }
        <input type="file" accept=".pdf" (change)="importPdf($event)" hidden />
      </label>
    </div>
  </div>

  <mat-card>
    <mat-card-content>
      <mat-form-field appearance="outline" class="search-field">
        <mat-label>Buscar</mat-label>
        <mat-icon matSuffix>search</mat-icon>
        <input matInput (input)="applyFilter($event)" placeholder="Nombre, email, clave…" />
      </mat-form-field>

      @if (loading()) {
        <div class="center"><mat-spinner diameter="40" /></div>
      } @else {
        <div class="table-wrapper">
          <table mat-table [dataSource]="dataSource" matSort class="full-width">
            <ng-container matColumnDef="nombre">
              <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
              <td mat-cell *matCellDef="let r">{{ nombreMostrado(r) }}</td>
            </ng-container>
            <ng-container matColumnDef="apellido">
              <th mat-header-cell *matHeaderCellDef mat-sort-header>Apellido</th>
              <td mat-cell *matCellDef="let r">{{ apellidoMostrado(r) }}</td>
            </ng-container>
            <ng-container matColumnDef="email">
              <th mat-header-cell *matHeaderCellDef>Correo</th>
              <td mat-cell *matCellDef="let r">{{ r.email }}</td>
            </ng-container>
            <ng-container matColumnDef="clave_empleado">
              <th mat-header-cell *matHeaderCellDef>Clave</th>
              <td mat-cell *matCellDef="let r">{{ r.clave_empleado }}</td>
            </ng-container>
            <ng-container matColumnDef="departamento">
              <th mat-header-cell *matHeaderCellDef>Departamento</th>
              <td mat-cell *matCellDef="let r">{{ r.departamento ?? '—' }}</td>
            </ng-container>
            <ng-container matColumnDef="acciones">
              <th mat-header-cell *matHeaderCellDef>Acciones</th>
              <td mat-cell *matCellDef="let r">
                <button mat-icon-button color="warn" (click)="darDeBaja(r)" matTooltip="Dar de baja">
                  <mat-icon>person_off</mat-icon>
                </button>
              </td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            <tr class="mat-row" *matNoDataRow>
              <td class="mat-cell no-data" [attr.colspan]="displayedColumns.length">Sin resultados</td>
            </tr>
          </table>
        </div>
        <mat-paginator [pageSizeOptions]="[10,25,50]" showFirstLastButtons />
      }
    </mat-card-content>
  </mat-card>
</div>
