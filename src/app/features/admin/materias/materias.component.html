<div class="page">
  <div class="page-header">
    <h2 class="page-title">Materias</h2>
    <div class="actions">
      <button mat-flat-button color="primary" (click)="openForm()">
        <mat-icon>add</mat-icon> Nueva materia
      </button>
      <button mat-stroked-button color="primary" (click)="openImportDialog()">
        <mat-icon>upload_file</mat-icon> Importar PDF
      </button>
    </div>
  </div>
  <mat-card>
    <mat-card-content>
      <mat-form-field appearance="outline" class="search-field">
        <mat-label>Buscar</mat-label>
        <mat-icon matSuffix>search</mat-icon>
        <input matInput (input)="applyFilter($event)" placeholder="NRC, nombre…" />
      </mat-form-field>
      @if (loading()) {
        <div class="center"><mat-spinner diameter="40" /></div>
      } @else {
        <div class="table-wrapper">
          <table mat-table [dataSource]="dataSource" matSort class="full-width">
            <ng-container matColumnDef="nrc">
              <th mat-header-cell *matHeaderCellDef mat-sort-header>NRC</th>
              <td mat-cell *matCellDef="let r">{{ r.nrc }}</td>
            </ng-container>
            <ng-container matColumnDef="nombre">
              <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
              <td mat-cell *matCellDef="let r">{{ r.nombre }}</td>
            </ng-container>
            <ng-container matColumnDef="periodo_nombre">
              <th mat-header-cell *matHeaderCellDef>Periodo</th>
              <td mat-cell *matCellDef="let r">{{ r.periodo_nombre ?? r.periodo_id }}</td>
            </ng-container>
            <ng-container matColumnDef="horario">
              <th mat-header-cell *matHeaderCellDef>Horario</th>
              <td mat-cell *matCellDef="let r">{{ r.horario ?? '—' }}</td>
            </ng-container>
            <ng-container matColumnDef="docente_nombre">
              <th mat-header-cell *matHeaderCellDef>Docente</th>
              <td mat-cell *matCellDef="let r">{{ r.docente_nombre ?? '—' }}</td>
            </ng-container>
            <ng-container matColumnDef="acciones">
              <th mat-header-cell *matHeaderCellDef>Acciones</th>
              <td mat-cell *matCellDef="let r">
                <button mat-icon-button color="primary" (click)="openForm(r)" matTooltip="Editar"><mat-icon>edit</mat-icon></button>
                <button mat-icon-button color="warn"    (click)="delete(r)"   matTooltip="Eliminar"><mat-icon>delete</mat-icon></button>
              </td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            <tr class="mat-row" *matNoDataRow>
              <td class="mat-cell no-data" [attr.colspan]="displayedColumns.length">Sin resultados</td>
            </tr>
          </table>
        </div>
        <mat-paginator
          [length]="total()"
          [pageIndex]="pageIndex"
          [pageSize]="pageSize"
          [pageSizeOptions]="[10,25,50]"
          showFirstLastButtons
          (page)="onPage($event)"
        />
      }
    </mat-card-content>
  </mat-card>
</div>
